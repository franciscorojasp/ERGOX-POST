<!DOCTYPE html>
<html lang="es-VE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PostSST Venezuela 🇻🇪</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#FFFBEB;min-height:100vh}
.btn{background:linear-gradient(135deg,#EAB308,#D97706);color:white;border:none;padding:12px 24px;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;transition:all 0.2s}
.btn:hover{transform:scale(1.02);box-shadow:0 4px 12px rgba(234,179,8,0.4)}
.btn:active{transform:scale(0.98)}
.btn-sm{padding:8px 16px;font-size:14px}
.btn-danger{background:linear-gradient(135deg,#EF4444,#DC2626)}
.btn-success{background:linear-gradient(135deg,#059669,#047857)}
.btn-blue{background:linear-gradient(135deg,#2563EB,#1D4ED8)}
.btn-purple{background:linear-gradient(135deg,#7C3AED,#6D28D9)}
.card{background:white;border-radius:16px;padding:24px;border:1px solid #f0f0f0;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
input,select,textarea{padding:12px 16px;border-radius:12px;border:1px solid #ddd;font-size:16px;width:100%;outline:none;transition:border 0.2s}
input:focus,select:focus,textarea:focus{border-color:#EAB308;box-shadow:0 0 0 3px rgba(234,179,8,0.15)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:12px 8px;border-bottom:2px solid #eee;color:#666;font-size:12px;text-transform:uppercase}
td{padding:12px 8px;border-bottom:1px solid #f5f5f5}
.badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block}
.badge-ve{background:#FEF3C7;color:#92400E}
.badge-alta{background:#FEE2E2;color:#991B1B}
.badge-media{background:#FEF3C7;color:#92400E}
.badge-baja{background:#D1FAE5;color:#065F46}
.badge-admin{background:#FEE2E2;color:#991B1B}
.badge-editor{background:#FEF3C7;color:#92400E}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.tab{display:none}
.tab.active{display:block}
.tab-btn{background:none;border:none;padding:12px 20px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;color:#666;transition:all 0.2s;white-space:nowrap}
.tab-btn.active{border-bottom-color:#EAB308;color:#000;font-weight:bold}
.hidden{display:none !important}

.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:14px 20px;border-radius:12px;color:white;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,0.15);animation:toastIn 0.3s ease;max-width:360px;display:flex;align-items:center;gap:10px}
.toast-success{background:linear-gradient(135deg,#059669,#047857)}
.toast-error{background:linear-gradient(135deg,#EF4444,#DC2626)}
.toast-info{background:linear-gradient(135deg,#2563EB,#1D4ED8)}
.toast-out{animation:toastOut 0.3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(60px)}}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9998;animation:fadeIn 0.2s}
.modal-content{background:white;border-radius:16px;padding:32px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;animation:scaleIn 0.2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}

.stat-card{border-radius:16px;padding:24px;text-align:center;color:white}
.stat-card .icon{font-size:36px;margin-bottom:8px}
.stat-card .num{font-size:28px;font-weight:bold}
.stat-card .label{font-size:14px;opacity:0.85}

.post-preview{background:#F9FAFB;padding:16px;border-radius:12px;font-size:14px;line-height:1.6;white-space:pre-wrap;border:1px solid #eee;margin-bottom:12px}

.fade-in{animation:fadeIn 0.3s ease}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast-container" class="toast-container"></div>
<div id="modal-root"></div>

<script>
(function() {
  'use strict';

  const VERSION = '2.0';

  const NORMATIVAS = {

    CO:{nombre:'Colombia',flag:'🇨🇴',leyes:['Decreto 1072','Resolución 0312','GTC-45'],moneda:'COP',tasa:4150},

  };

  const PLANES = [
    {id:'starter',nombre:'🚀 Starter',precio:9.99,creditos:10,popular:false},
    {id:'profesional',nombre:'⭐ Profesional',precio:39.99,creditos:50,popular:true},
    {id:'empresarial',nombre:'🏢 Empresarial',precio:129.99,creditos:200,popular:false},
  ];

  const CALENDARIO_BASE = [
    {fecha:'2025-01-15',titulo:'📋 PSST registrado INPSASEL',tipo:'vencimiento',urgencia:'alta',ley:'NT-04-2023',paises:['VE']},
    {fecha:'2025-03-31',titulo:'📚 16h trimestrales formación SST',tipo:'formacion',urgencia:'alta',ley:'LOPCYMAT Art.56',paises:['VE']},
    {fecha:'2025-04-15',titulo:'🩺 Exámenes médicos periódicos',tipo:'obligacion',urgencia:'alta',ley:'LOPCYMAT Art.40',paises:['VE']},
    {fecha:'2025-06-15',titulo:'🔴 Simulacro emergencias semestral',tipo:'inspeccion',urgencia:'alta',ley:'LOPCYMAT Art.56',paises:['VE']},
    {fecha:'2025-09-30',titulo:'📚 48h formación acumuladas',tipo:'formacion',urgencia:'media',ley:'NT-03-2016',paises:['VE']},
    {fecha:'2025-10-15',titulo:'🔴 2do Simulacro emergencias',tipo:'inspeccion',urgencia:'alta',ley:'LOPCYMAT Art.56',paises:['VE']},
    {fecha:'2025-12-01',titulo:'🔴 Auditoría interna SST',tipo:'inspeccion',urgencia:'alta',ley:'NT-04-2023',paises:['VE']},
    {fecha:'2025-12-31',titulo:'📊 Cierre anual PSST',tipo:'vencimiento',urgencia:'alta',ley:'LOPCYMAT',paises:['VE']},
    {fecha:'2025-02-28',titulo:'📋 Plan de gestión de riesgos SG-SST',tipo:'vencimiento',urgencia:'alta',ley:'Decreto 1072',paises:['CO']},
    {fecha:'2025-05-01',titulo:'📚 Capacitación SST 50h anuales',tipo:'formacion',urgencia:'media',ley:'Resolución 0312',paises:['CO']},
    {fecha:'2025-07-15',titulo:'🩺 Exámenes ocupacionales Colombia',tipo:'obligacion',urgencia:'alta',ley:'Resolución 0312',paises:['CO']},
    {fecha:'2025-10-01',titulo:'🔴 Simulacro evacuación CO',tipo:'inspeccion',urgencia:'alta',ley:'Decreto 1072',paises:['CO']},
    {fecha:'2025-03-15',titulo:'📋 Identificación de riesgos psicosociales',tipo:'vencimiento',urgencia:'alta',ley:'NOM-035-STPS',paises:['MX']},
    {fecha:'2025-06-30',titulo:'📚 Capacitación seguridad MX',tipo:'formacion',urgencia:'media',ley:'NOM-017-STPS',paises:['MX']},
    {fecha:'2025-04-01',titulo:'📋 Comité de Seguridad y Salud PE',tipo:'vencimiento',urgencia:'alta',ley:'Ley 29783',paises:['PE']},
    {fecha:'2025-08-15',titulo:'🩺 Exámenes ocupacionales PE',tipo:'obligacion',urgencia:'alta',ley:'DS 005-2012-TR',paises:['PE']},
  ];

  const TEMAS_RAPIDOS = {
    VE:[
      {label:'📋 PSST NT-04-2023',tema:'PSST según NT-04-2023 INPSASEL'},
      {label:'👥 CSSL',tema:'Comité de Seguridad CSSL LOPCYMAT'},
      {label:'📚 16h formación',tema:'16 horas trimestrales formación SST'},
      {label:'🩺 Exámenes',tema:'Exámenes médicos ocupacionales'},
      {label:'🔥 Riesgos',tema:'Identificación de riesgos laborales'},
      {label:'⚡ Electricidad',tema:'Seguridad eléctrica en el trabajo'},
      {label:'🧪 Químicos',tema:'Manejo de sustancias químicas peligrosas'},
      {label:'🏗️ Construcción',tema:'Seguridad en obras de construcción'},
    ],
    CO:[
      {label:'📋 SG-SST',tema:'Sistema de Gestión SG-SST Decreto 1072'},
      {label:'👥 COPASST',tema:'Comité COPASST Colombia'},
      {label:'📚 Capacitación',tema:'Capacitación 50h anuales SST Colombia'},
      {label:'🩺 Examenes',tema:'Exámenes ocupacionales Resolución 0312'},
    ],
    MX:[
      {label:'🧠 NOM-035',tema:'Riesgos psicosociales NOM-035-STPS'},
      {label:'🏋️ NOM-017',tema:'Equipo de protección NOM-017-STPS'},
      {label:'📋 Comisiones',tema:'Comisiones de seguridad STPS'},
    ],
    PE:[
      {label:'📋 Ley 29783',tema:'Sistema de gestión Ley 29783'},
      {label:'👥 Comité PE',tema:'Comité de seguridad DS 005-2012-TR'},
      {label:'📚 IPERC',tema:'Identificación de peligros IPERC'},
    ],
  };

  let state = loadState();

  function getPerfilDefault() {
    return {nombreEmpresa:'',rif:'',logoUrl:'',direccionFiscal:'',telefono:'',emailContacto:'',personaContacto:'',pais:'VE'};
  }

  function getDefaultState() {
    return {
      usuarios:{
        'admin@sst.com':{nombre:'Admin PostSST',rol:'ADMIN',pass:'123456',empresa:'Plataforma',cred:1000,perfil:getPerfilDefault()},
        'empresa@sst.ve':{nombre:'Constructora Venezuela',rol:'EDITOR',pass:'empresa123',empresa:'Constructora Ávila C.A.',cred:100,perfil:getPerfilDefault()},
      },
      currentUser:null,
      historial:[],
      leads:[],
      leadMagnets:[],
      totalPosts:0,
      totalIngresos:0,
      activeTab:'generador',
      _pais:'VE',
      _tipo:'educativo',
    };
  }

  function loadState() {
    try {
      const saved = localStorage.getItem('postsst_state');
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed._version === VERSION) {
          Object.keys(parsed.usuarios || {}).forEach(function(email) {
            if (!parsed.usuarios[email].perfil) {
              parsed.usuarios[email].perfil = getPerfilDefault();
            }
          });
          return parsed;
        }
      }
    } catch(e) {}
    const s = getDefaultState();
    s._version = VERSION;
    return s;
  }

  function saveState() {
    const toSave = Object.assign({}, state);
    delete toSave._ultimoPost;
    toSave._version = VERSION;
    try { localStorage.setItem('postsst_state', JSON.stringify(toSave)); } catch(e) {}
  }

  function getCredits() {
    if (!state.currentUser) return 0;
    return state.usuarios[state.currentUser.email].cred;
  }

  function setCredits(val) {
    if (!state.currentUser) return;
    state.usuarios[state.currentUser.email].cred = val;
    saveState();
  }

  function useCredit() {
    const c = getCredits();
    if (c < 1) return false;
    setCredits(c - 1);
    return true;
  }

  function addCredits(amount) {
    setCredits(getCredits() + amount);
  }

  function toast(msg, type) {
    type = type || 'success';
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast toast-' + type;
    const icons = {success:'✅',error:'❌',info:'ℹ️'};
    el.innerHTML = '<span>' + (icons[type]||'') + '</span><span>' + msg + '</span>';
    container.appendChild(el);
    setTimeout(function() {
      el.classList.add('toast-out');
      setTimeout(function() { el.remove(); }, 300);
    }, 3000);
  }

  function showModal(contentHtml, onMount) {
    const root = document.getElementById('modal-root');
    root.innerHTML = '<div class="modal-overlay" id="modal-overlay"><div class="modal-content">' + contentHtml + '</div></div>';
    document.getElementById('modal-overlay').addEventListener('click', function(e) {
      if (e.target.id === 'modal-overlay') closeModal();
    });
    if (onMount) onMount();
  }

  function closeModal() {
    document.getElementById('modal-root').innerHTML = '';
  }

  function escHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function generarPostContent(tipo, tema, pais) {
    const norm = NORMATIVAS[pais] || NORMATIVAS.VE;
    const perfil = (state.currentUser && state.usuarios[state.currentUser.email]) ? (state.usuarios[state.currentUser.email].perfil || getPerfilDefault()) : getPerfilDefault();
    const empresa = perfil.nombreEmpresa || (state.currentUser ? state.usuarios[state.currentUser.email].empresa : 'Tu Empresa');
    const normLabels = {VE:'RIF',CO:'NIT',MX:'RFC',PE:'RUC'};
    const rifLabel = normLabels[pais] || 'RIF';
    const rifText = perfil.rif ? '\n' + rifLabel + ': ' + perfil.rif : '';
    const dirText = perfil.direccionFiscal ? '\n📍 ' + perfil.direccionFiscal : '';
    const telText = perfil.telefono ? '\n📞 ' + perfil.telefono : '';
    const emailText = perfil.emailContacto ? '\n📧 ' + perfil.emailContacto : '';
    const contactoText = perfil.personaContacto ? '\n👤 ' + perfil.personaContacto : '';
    const contactoBlock = (telText || emailText || contactoText) ? '\n\nContáctanos:' + telText + emailText + contactoText : '';
    const footer = contactoBlock + dirText + rifText;
    const templates = {
      VE:{
        educativo:'📚 ' + tema + '\n\n"' + norm.leyes[0] + ' establece que toda empresa debe contar con un Programa de Seguridad y Salud en el Trabajo (PSST) debidamente registrado ante INPSASEL."\n\nEn ' + empresa + ' cumplimos con esta normativa porque la seguridad de nuestro equipo es prioridad.\n\n✅ PSST registrado\n✅ Delegado de prevención designado\n✅ Comité SSLS constituido\n\n¿Tu empresa cumple? Contáctanos para una asesoría personalizada.' + footer,
        promocional:'📢 ' + tema + '\n\nEn ' + empresa + ' te ayudamos a implementar y mantener el cumplimiento de:\n\n✅ ' + norm.leyes.join('\n✅ ') + '\n\n🏢 PSST registrado ante INPSASEL\n📚 Capacitación 16h trimestrales cumplidas\n👥 CSSL constituido y activo\n🩺 Exámenes médicos al día\n\n📱 Contáctanos hoy y evita multas de 30 a 100 UT.' + footer,
        conciencia:'⚠️ ' + tema + '\n\n"El artículo 56 de la LOPCYMAT exige que toda empresa tenga un Servicio de SST. El incumplimiento puede generar multas de 30 a 100 UT (más de Bs. 3.000 en 2025)."\n\nAdemás, la NT-04-2023 INPSASEL establece sanciones por:\n❌ No tener PSST registrado\n❌ No realizar exámenes médicos\n❌ No constituir el CSSL\n\n' + empresa + ' te ayuda a cumplir y proteger a tu equipo.' + footer,
      },
      CO:{
        educativo:'📚 ' + tema + '\n\n"El ' + norm.leyes[0] + ' establece que toda empresa con 10 o más trabajadores debe implementar un Sistema de Gestión de Seguridad y Salud en el Trabajo (SG-SST)."\n\nEn ' + empresa + ' cumplimos con esta normativa porque protegemos lo más valioso: nuestro talento humano.\n\n¿Tu empresa está al día? Contáctanos para una evaluación.' + footer,
        promocional:'📢 ' + tema + '\n\nEn ' + empresa + ' te ayudamos a implementar y mantener el cumplimiento normativo colombiano:\n\n✅ ' + norm.leyes.join('\n✅ ') + '\n\n📋 SG-SST implementado\n👥 COPASST activo\n🩺 Exámenes ocupacionales vigentes\n\n📱 Escríbenos y protege a tu equipo.' + footer,
        conciencia:'⚠️ ' + tema + '\n\n"El incumplimiento del SG-SST puede generar multas hasta 500 SMMLV según el ' + norm.leyes[0] + '. Más de $580 millones de pesos en 2025."\n\nNo arriesgues tu empresa. ' + empresa + ' te ayuda a cumplir.' + footer,
      },
      MX:{
        educativo:'📚 ' + tema + '\n\n"La ' + norm.leyes[0] + ' obliga a los empleadores a identificar, analizar y prevenir los factores de riesgo psicosocial en el centro de trabajo."\n\nEn ' + empresa + ' la salud mental de nuestro equipo es prioridad.\n\n¿Tu empresa cumple con la NOM-035? Contáctanos.' + footer,
        promocional:'📢 ' + tema + '\n\nEn ' + empresa + ' te apoyamos con el cumplimiento de:\n\n✅ ' + norm.leyes.join('\n✅ ') + '\n\n📋 Evaluaciones de riesgos psicosociales\n🏋️ EPP certificado\n📚 Capacitación constante\n\n📱 Contáctanos hoy.' + footer,
        conciencia:'⚠️ ' + tema + '\n\n"La ' + norm.leyes[0] + ' establece sanciones administrativas de hasta 425 UMA por incumplimiento. Protege a tu equipo y evita sanciones."\n\n' + empresa + ' te ayuda a cumplir.' + footer,
      },
      PE:{
        educativo:'📚 ' + tema + '\n\n"La ' + norm.leyes[0] + ' establece que todo empleador debe garantizar un entorno de trabajo seguro implementando un sistema de gestión de SST."\n\nEn ' + empresa + ' cumplimos con la normativa porque la seguridad es inversión, no gasto.\n\n¿Tu empresa cumple? Contáctanos.' + footer,
        promocional:'📢 ' + tema + '\n\nEn ' + empresa + ' te ayudamos con el cumplimiento de:\n\n✅ ' + norm.leyes.join('\n✅ ') + '\n\n📋 IPERC actualizado\n👥 Comité SST activo\n🩺 Exámenes ocupacionales\n\n📱 Contáctanos y protege a tu equipo.' + footer,
        conciencia:'⚠️ ' + tema + '\n\n"La ' + norm.leyes[0] + ' establece paralización de actividades y multas por incumplimiento. La seguridad no es negociable."\n\n' + empresa + ' te ayuda a cumplir con la ley y cuidar a tus trabajadores.' + footer,
      },
    };
    return (templates[pais] && templates[pais][tipo]) || templates.VE.educativo;
  }

  function generarHashtags(tipo, pais) {
    const norm = NORMATIVAS[pais] || NORMATIVAS.VE;
    const base = ['#' + norm.nombre.replace(/\s/g,''), '#' + norm.leyes[0].replace(/[\s/]/g,''), '#SST', '#Prevencion'];
    const extras = {
      educativo:['#CapacitacionSST','#SeguridadLaboral'],
      promocional:['#ServiciosSST','#ConsultoriaSST'],
      conciencia:['#Concienciacion','#CeroAccidentes'],
    };
    return base.concat(extras[tipo] || []);
  }

  function crearPost(tipo, tema, pais) {
    if (!useCredit()) {
      toast('Créditos insuficientes. Compra más para continuar.', 'error');
      return null;
    }
    const caption = generarPostContent(tipo, tema, pais);
    const hashtags = generarHashtags(tipo, pais);
    const post = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      caption: caption,
      tipo: tipo,
      pais: pais || 'VE',
      hashtags: hashtags,
      fecha: new Date().toISOString(),
      likes: Math.floor(Math.random() * 500) + 50,
    };
    state.historial.unshift(post);
    state.totalPosts++;
    state._ultimoPost = post;
    saveState();
    return post;
  }

  function crearLeadMagnet(titulo, url) {
    const lm = {id: Date.now().toString(36), titulo: titulo, url: url, leads: [], creado: new Date().toISOString()};
    state.leadMagnets.push(lm);
    saveState();
    return lm;
  }

  function login(email, pass) {
    const u = state.usuarios[email];
    if (!u || u.pass !== pass) return false;
    state.currentUser = {email: email, nombre: u.nombre, rol: u.rol, empresa: u.empresa};
    saveState();
    return true;
  }

  function logout() {
    state.currentUser = null;
    state.activeTab = 'generador';
    saveState();
    render();
  }

  function formatFecha(iso) {
    return new Date(iso).toLocaleDateString('es-VE', {day:'2-digit',month:'short',year:'numeric'});
  }

  function formatCorta(fechaStr) {
    return new Date(fechaStr + 'T12:00:00').toLocaleDateString('es-VE', {day:'2-digit',month:'short'});
  }

  function diasRestantes(fechaStr) {
    const hoy = new Date();
    hoy.setHours(0,0,0,0);
    const target = new Date(fechaStr + 'T12:00:00');
    target.setHours(0,0,0,0);
    return Math.ceil((target - hoy) / (1000*60*60*24));
  }

  // ==================== RENDER ====================

  function render() {
    const app = document.getElementById('app');
    if (!state.currentUser) {
      renderLogin(app);
    } else {
      renderDashboard(app);
    }
  }

  function renderLogin(c) {
    c.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">' +
      '<div class="card" style="max-width:440px;width:100%;text-align:center;padding:40px">' +
        '<div style="font-size:64px;margin-bottom:16px">🇻🇪</div>' +
        '<h1 style="font-size:24px;margin-bottom:4px">PostSST <span style="color:#EAB308">Venezuela</span></h1>' +
        '<p style="color:#666;font-size:14px;margin-bottom:24px">LOPCYMAT · INPSASEL · NT-04-2023</p>' +
        '<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px">' +
          '<input id="login-email" value="" placeholder="Email" />' +
          '<input id="login-pass" type="password" value="" placeholder="Contraseña" />' +
          '<div id="login-error" style="color:#DC2626;font-size:14px;display:none"></div>' +
          '<button class="btn" id="btn-login">🇻🇪 Ingresar</button>' +
        '</div>' +
        '<div style="font-size:13px;color:#666;margin-bottom:12px">— acceso rápido —</div>' +
        '<div class="grid-2" style="gap:8px">' +

      '</div>' +

          navigator.clipboard.writeText(p.caption + '\n\n' + p.hashtags.join(' ')).then(function() {
            toast('Publicación copiada', 'success');
          }).catch(function() { toast('Error al copiar', 'error'); });

      });

    c.querySelectorAll('[data-action="delete"]').forEach(function(btn) {

  function renderCreditos(c) {
    var credits = getCredits();
    var norm = NORMATIVAS[state._pais || 'VE'];
    var tasa = norm.tasa;

    var planes = PLANES.map(function(plan) {
      var local = (plan.precio * tasa).toFixed(0);
      var tipoMoneda = norm.moneda;
      return '<div class="card' + (plan.popular ? '" style="text-align:center;border:2px solid #EAB308;position:relative' : '" style="text-align:center') + '">' +
        (plan.popular ? '<div style="position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#EAB308;color:white;padding:2px 16px;border-radius:20px;font-size:12px;font-weight:bold">POPULAR</div>' : '') +
        '<h3 style="font-size:14px;color:#666;margin-bottom:8px;margin-top:' + (plan.popular?'8px':'0') + '">' + plan.nombre + '</h3>' +
        '<div style="font-size:32px;font-weight:bold">$' + plan.precio.toFixed(2) + '</div>' +
        '<p style="color:#666;font-size:13px">≈ ' + tipoMoneda + ' ' + Number(local).toLocaleString() + '</p>' +
        '<p style="margin:12px 0;font-weight:bold">' + plan.creditos + ' créditos</p>' +
        '<p style="font-size:12px;color:#999;margin-bottom:12px">$' + (plan.precio / plan.creditos).toFixed(2) + ' por post</p>' +
        '<button class="btn" style="width:100%" data-buy-plan="' + plan.id + '">Comprar</button>' +
      '</div>';
    }).join('');

    c.innerHTML = '<div style="background:linear-gradient(135deg,#EAB308,#D97706);border-radius:16px;padding:32px;color:white;margin-bottom:16px" class="fade-in">' +
      '<h2 style="font-size:24px;font-weight:bold">🪙 ' + credits + ' créditos disponibles</h2>' +
      '<p style="opacity:0.9;margin-top:4px">1 post = 1 crédito · 1 WhatsApp = 0.5 créditos</p>' +
    '</div>' +
    '<div class="grid-3 fade-in">' + planes + '</div>';

    c.querySelectorAll('[data-buy-plan]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var planId = btn.getAttribute('data-buy-plan');
        var plan = PLANES.find(function(p) { return p.id === planId; });
        if (!plan) return;
        showModal(
          '<h2 style="font-size:18px;margin-bottom:12px">💳 Comprar ' + plan.nombre + '</h2>' +
          '<p style="font-size:16px;margin-bottom:8px"><strong>' + plan.creditos + ' créditos</strong> por <strong>$' + plan.precio.toFixed(2) + '</strong></p>' +
          '<p style="font-size:13px;color:#666;margin-bottom:16px">Simulación de compra — en producción se integraría con un gateway de pago (MercadoPago, PayPal, etc.)</p>' +
          '<div style="padding:16px;background:#F9FAFB;border-radius:12px;margin-bottom:16px">' +
            '<p style="font-size:13px;color:#666;margin-bottom:8px">Métodos de pago simulados:</p>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
              '<button class="btn btn-sm btn-blue" id="btn-mpago">💳 MercadoPago</button>' +
              '<button class="btn btn-sm" id="btn-paypal" style="background:#003087">🅿️ PayPal</button>' +
              '<button class="btn btn-sm btn-success" id="btn-zelle">🏦 Zelle</button>' +
            '</div>' +
          '</div>' +
          '<button class="btn btn-sm" style="background:#6B7280" id="btn-cancel-buy">Cancelar</button>',

          function() {
            document.getElementById('btn-cancel-buy').addEventListener('click', closeModal);
            document.getElementById('btn-mpago').addEventListener('click', function() { simularCompra(plan); });
            document.getElementById('btn-paypal').addEventListener('click', function() { simularCompra(plan); });
            document.getElementById('btn-zelle').addEventListener('click', function() { simularCompra(plan); });
          }
        );
      });
    });
  }

  function simularCompra(plan) {
    addCredits(plan.creditos);
    state.totalIngresos += plan.precio;
    saveState();
    closeModal();
    updateCreditsBadge();
    toast('+' + plan.creditos + ' créditos agregados (simulado)', 'success');
    renderCreditos(document.getElementById('tab-content'));
  }

  function buildPerfilPreview(perfil) {
    var normLabels = {VE:'RIF',CO:'NIT',MX:'RFC',PE:'RUC'};
    var normFlags = {VE:'🇻🇪',CO:'🇨🇴',MX:'🇲🇽',PE:'🇵🇪'};
    var label = normLabels[perfil.pais] || 'RIF';
    var flag = normFlags[perfil.pais] || '🇻🇪';
    var nombre = perfil.nombreEmpresa || 'Nombre de tu empresa';
    var rif = perfil.rif ? label + ': ' + perfil.rif : '';
    var dir = perfil.direccionFiscal || '';
    var tel = perfil.telefono || '';
    var email = perfil.emailContacto || '';
    var contacto = perfil.personaContacto || '';

    var logo = '';
    if (perfil.logoUrl) {
      logo = '<div style="text-align:center;margin-bottom:12px"><img src="' + escHtml(perfil.logoUrl) + '" style="max-width:80px;max-height:80px;border-radius:10px;object-fit:contain" alt="Logo" /></div>';
    }

    return '<div style="background:white;border:1px solid #eee;border-radius:12px;padding:16px;font-size:13px">' +
      logo +
      '<div style="text-align:center;margin-bottom:12px">' +
        '<p style="font-weight:bold;font-size:16px;color:#1F2937">' + escHtml(nombre) + '</p>' +
        (rif ? '<p style="color:#92400E;font-weight:bold">' + flag + ' ' + escHtml(rif) + '</p>' : '') +
      '</div>' +
      (dir ? '<p style="margin-bottom:4px">📍 ' + escHtml(dir) + '</p>' : '') +
      (tel ? '<p style="margin-bottom:4px">📞 ' + escHtml(tel) + '</p>' : '') +
      (email ? '<p style="margin-bottom:4px">📧 ' + escHtml(email) + '</p>' : '') +
      (contacto ? '<p style="margin-bottom:4px">👤 ' + escHtml(contacto) + '</p>' : '') +
      (!dir && !tel && !email && !contacto && !rif ? '<p style="color:#999;text-align:center;padding:12px">Completa los campos para ver la vista previa</p>' : '') +
    '</div>';
  }

  function buildPerfilSummary(perfil, normLabels) {
    var label = normLabels[perfil.pais] || 'RIF';
    var fields = [
      {icon:'🏢',label:'Empresa',value:perfil.nombreEmpresa},
      {icon:'🔢',label:label,value:perfil.rif},
      {icon:'🌍',label:'País',value:(NORMATIVAS[perfil.pais]||NORMATIVAS.VE).flag + ' ' + (NORMATIVAS[perfil.pais]||NORMATIVAS.VE).nombre},
      {icon:'📍',label:'Dirección',value:perfil.direccionFiscal},
      {icon:'📞',label:'Teléfono',value:perfil.telefono},
      {icon:'📧',label:'Email',value:perfil.emailContacto},
      {icon:'👤',label:'Contacto',value:perfil.personaContacto},
      {icon:'📷',label:'Logo',value:perfil.logoUrl ? '✅ Cargado' : '❌ Sin cargar'},
    ];
    return fields.map(function(f) {
      return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px">' +
        '<span style="color:#666">' + f.icon + ' ' + f.label + '</span>' +
        '<span style="font-weight:bold;text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escHtml(f.value || '—') + '">' + escHtml(f.value || '—') + '</span>' +
      '</div>';
    }).join('');
  }

              if (!email || !nombre || !pass) { toast('Completa los campos obligatorios', 'error'); return; }
              if (users[email]) { toast('Ese email ya existe', 'error'); return; }
              users[email] = {nombre: nombre, rol: rol, pass: pass, empresa: empresa || nombre, cred: 20, perfil: getPerfilDefault()};
              saveState();
              closeModal();
              toast('Usuario ' + nombre + ' creado', 'success');
              renderAdmin(c);
            });
          }
        );
      });
    }

    var resetBtn = document.getElementById('btn-reset-data');
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        showModal(
          '<h2 style="font-size:18px;margin-bottom:12px">⚠️ Resetear todos los datos</h2>' +
          '<p style="color:#666;font-size:14px;margin-bottom:20px">Esto eliminará todo el historial, leads y configuraciones. ¿Continuar?</p>' +
          '<div style="display:flex;gap:8px">' +
            '<button class="btn btn-danger" id="btn-confirm-reset" style="flex:1">Sí, resetear</button>' +
            '<button class="btn btn-sm" style="background:#6B7280" id="btn-cancel-reset">Cancelar</button>' +
          '</div>',
          function() {
            document.getElementById('btn-cancel-reset').addEventListener('click', closeModal);
            document.getElementById('btn-confirm-reset').addEventListener('click', function() {
              localStorage.removeItem('postsst_state');
              state = getDefaultState();
              state._version = VERSION;
              saveState();
              closeModal();
              toast('Datos reseteados', 'info');
              logout();
            });
          }
        );
      });
    }

    var exportBtn = document.getElementById('btn-export-state');
    if (exportBtn) {
      exportBtn.addEventListener('click', function() {
        var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'PostSST_Estado_' + new Date().toISOString().slice(0,10) + '.json';
        a.click(); URL.revokeObjectURL(url);
        toast('Estado exportado como JSON', 'success');
      });
    }
  }

  // ==================== INIT ====================
  if (state.currentUser) {
    var u = state.usuarios[state.currentUser.email];
    if (!u) {
      state.currentUser = null;
      saveState();
    }
  }
  render();

})();
</script>
</body>
</html>
